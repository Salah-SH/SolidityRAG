[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solidityrag"
version = "0.1.0"
description = "Benchmark-first retrieval toolkit for smart contract security auditing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.7"]
ast = ["tree-sitter>=0.23", "tree-sitter-solidity>=1.2.11"]

[project.scripts]
solidityrag = "solidityrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solidityrag.eval" = ["queries.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]